# Builds the Windows app on GitHub's own Windows machine, so nobody needs Node
# or a Windows build setup locally. Run it from the Actions tab ("Run workflow").
#
# After building, it starts the finished app to prove it works, and tries
# the tricks people use to tamper with Electron apps to prove they fail.
# Only when every check passes does it PUBLISH the release (the exe, the
# portable exe and latest.yml for auto-update), so the download page and the
# app's updater pick it up straight away. A failed run publishes nothing.
# To release a new version, raise "version" in package.json first.
name: Build Windows app

on:
  workflow_dispatch:

permissions:
  contents: write          # to publish the release

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22        # Electron 44 needs 22.12 or newer to install

      - name: Install
        run: npm install

      - name: Build
        run: npx electron-builder --win --publish never
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Nothing is code-signed, so skip fetching the signing toolkit
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'

      - name: Check the fuses (locks built into the exe)
        shell: pwsh
        run: |
          $out = npx --no-install @electron/fuses read --app "dist\win-unpacked\Flappy Crix.exe" | Out-String
          $out
          foreach ($want in 'RunAsNode is Disabled', 'EnableNodeOptionsEnvironmentVariable is Disabled',
                            'EnableNodeCliInspectArguments is Disabled', 'OnlyLoadAppFromAsar is Enabled') {
            if ($out -notmatch [regex]::Escape($want)) { throw "Expected: $want" }
          }

      - name: Start the app — it must load the game
        shell: pwsh
        run: |
          $exe = Join-Path $PWD 'dist\win-unpacked\Flappy Crix.exe'
          $out = Join-Path $env:RUNNER_TEMP 'smoke.json'
          $env:CRIX_SMOKE_TEST = $out
          $p = Start-Process -FilePath $exe -PassThru
          if (-not $p.WaitForExit(150000)) { $p.Kill(); throw 'The app did not finish starting in 2.5 minutes' }
          if (-not (Test-Path $out)) { throw "The app quit (exit $($p.ExitCode)) without loading anything" }
          $r = Get-Content $out -Raw | ConvertFrom-Json
          $r
          if (-not $r.ok) { throw 'The app started but never loaded the game' }
          if ($r.devTools) { throw 'Developer tools are switched on in the built app' }

      - name: A debugging port is refused
        shell: pwsh
        run: |
          $exe = Join-Path $PWD 'dist\win-unpacked\Flappy Crix.exe'
          $out = Join-Path $env:RUNNER_TEMP 'smoke-debug.json'
          $env:CRIX_SMOKE_TEST = $out
          $p = Start-Process -FilePath $exe -ArgumentList '--remote-debugging-port=9333' -PassThru
          if (-not $p.WaitForExit(60000)) { $p.Kill(); throw 'It kept running with a debugging port instead of refusing' }
          if (Test-Path $out) { throw 'It loaded the game with a debugging port open' }
          "Refused (exit $($p.ExitCode))"

      - name: It cannot be used as plain Node
        shell: pwsh
        run: |
          $exe = Join-Path $PWD 'dist\win-unpacked\Flappy Crix.exe'
          $log = Join-Path $env:RUNNER_TEMP 'as-node.txt'
          $env:ELECTRON_RUN_AS_NODE = '1'
          $env:CRIX_SMOKE_TEST = Join-Path $env:RUNNER_TEMP 'smoke-node.json'
          $p = Start-Process -FilePath $exe -ArgumentList '-e', "`"console.log('RAN_AS_NODE')`"" -RedirectStandardOutput $log -PassThru
          if (-not $p.WaitForExit(150000)) { $p.Kill() }
          if ((Test-Path $log) -and (Select-String -Path $log -Pattern 'RAN_AS_NODE' -Quiet)) { throw 'The exe ran code as plain Node' }
          'Not usable as Node'

      - name: Publish the release (only reached when every check passed)
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $version = (Get-Content package.json -Raw | ConvertFrom-Json).version
          $tag = "v$version"
          gh release view $tag --repo $env:GITHUB_REPOSITORY 2>$null
          if ($LASTEXITCODE -eq 0) { throw "Release $tag is already published. Raise the version in package.json to release again." }
          $files = @("dist\FlappyCrixSetup-$version.exe", "dist\FlappyCrixSetup-$version.exe.blockmap", "dist\FlappyCrix.exe", "dist\latest.yml")
          foreach ($f in $files) { if (-not (Test-Path $f)) { throw "Missing $f" } }
          $notes = "Flappy Crix $version for Windows.`n`n- **FlappyCrixSetup-$version.exe**: installer (recommended)`n- **FlappyCrix.exe**: portable, no install`n`nInstalled copies update themselves."
          gh release create $tag @files --repo $env:GITHUB_REPOSITORY --target $env:GITHUB_SHA --title $version --notes $notes --latest
          if ($LASTEXITCODE -ne 0) { throw 'Publishing failed' }

      # A copy on the run itself too, in case the release step is ever refused
      - uses: actions/upload-artifact@v4
        with:
          name: FlappyCrix-windows
          path: |
            dist/*.exe
            dist/latest.yml
