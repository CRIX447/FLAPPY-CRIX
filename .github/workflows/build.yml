# Builds the Flappy Crix desktop app (Rust + Tauri, in src-tauri/) on GitHub's own Windows
# machine, so nobody needs Rust or a Windows build setup locally. Run it from the Actions tab
# ("Build Windows app" > "Run workflow").
#
# After building, it starts the finished app to prove it loads the game, checks the tricks
# people use to remote-control apps don't work on it, and measures how much RAM it uses.
# Only when every check passes does it PUBLISH the release: the installer, the portable exe, and
# latest.yml (which moves players still on the old Electron app over to this one by itself).
# A failed run publishes nothing. To release a new version, raise "version" in
# src-tauri/tauri.conf.json AND src-tauri/Cargo.toml first.
name: Build Windows app

on:
  workflow_dispatch:
  pull_request:
    paths: ['src-tauri/**', 'app/**', '.github/workflows/build.yml']

permissions:
  contents: write          # to publish the release

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Rust
        run: |
          rustup toolchain install stable --profile minimal
          rustup default stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Unit tests (which addresses stay in the app, which open in the browser)
        run: cargo test --manifest-path src-tauri/Cargo.toml

      - name: Build
        run: npx --yes @tauri-apps/cli@2.12.4 build
        env:
          CI: true

      - name: Collect the downloads
        id: files
        shell: pwsh
        run: |
          $version = (Get-Content src-tauri/tauri.conf.json -Raw | ConvertFrom-Json).version
          New-Item -ItemType Directory -Force out | Out-Null
          $setup = Get-ChildItem src-tauri/target/release/bundle/nsis/*-setup.exe | Select-Object -First 1
          if (-not $setup) { throw 'The installer was not made' }
          Copy-Item $setup.FullName "out/FlappyCrixSetup-$version.exe"
          Copy-Item src-tauri/target/release/flappy-crix.exe out/FlappyCrix.exe
          Get-ChildItem out | ForEach-Object { '{0}  {1:N1} MB' -f $_.Name, ($_.Length / 1MB) }
          "version=$version" >> $env:GITHUB_OUTPUT

      - name: Start the app - it must load the game
        shell: pwsh
        run: |
          $out = Join-Path $env:RUNNER_TEMP 'smoke.json'
          $env:CRIX_SMOKE_TEST = $out
          $p = Start-Process -FilePath (Resolve-Path out/FlappyCrix.exe) -PassThru
          if (-not $p.WaitForExit(150000)) { $p.Kill(); throw 'The app did not finish starting in 2.5 minutes' }
          if (-not (Test-Path $out)) { throw "The app quit (exit $($p.ExitCode)) without loading anything" }
          $r = Get-Content $out -Raw | ConvertFrom-Json
          $r
          if (-not $r.ok) { throw 'The app started but never loaded the game' }
          if ($r.devTools) { throw 'Developer tools are switched on in the built app' }

      - name: A debugging port is refused
        shell: pwsh
        run: |
          # WebView2 would open a remote-control port if asked through this setting. The app must clear it.
          $out = Join-Path $env:RUNNER_TEMP 'smoke-debug.json'
          $env:CRIX_SMOKE_TEST = $out
          $env:CRIX_SMOKE_HOLD = '8000'
          $env:WEBVIEW2_ADDITIONAL_BROWSER_ARGUMENTS = '--remote-debugging-port=9333'
          $p = Start-Process -FilePath (Resolve-Path out/FlappyCrix.exe) -PassThru
          $open = $false
          for ($i = 0; $i -lt 60 -and -not $p.HasExited; $i++) {
            Start-Sleep -Seconds 2
            try { $c = New-Object Net.Sockets.TcpClient; $c.Connect('127.0.0.1', 9333); $open = $true; $c.Close(); break } catch { }
            if (Test-Path $out) { break }
          }
          Start-Sleep -Seconds 4
          try { $c = New-Object Net.Sockets.TcpClient; $c.Connect('127.0.0.1', 9333); $open = $true; $c.Close() } catch { }
          if (-not $p.HasExited) { $p.WaitForExit(30000) | Out-Null; if (-not $p.HasExited) { $p.Kill() } }
          if ($open) { throw 'A debugging port opened' }
          if (-not (Test-Path $out)) { throw 'The app did not load the game in this test' }
          'No debugging port: refused'

      - name: Measure RAM (Rust app vs the old Electron app)
        shell: pwsh
        continue-on-error: true
        run: |
          function Measure-App($exe, $names, $label) {
            $before = @(Get-Process -ErrorAction SilentlyContinue | ForEach-Object Id)
            $p = Start-Process -FilePath $exe -PassThru
            Start-Sleep -Seconds 40
            $procs = Get-Process -ErrorAction SilentlyContinue | Where-Object { $names -contains $_.ProcessName -and $before -notcontains $_.Id }
            $mb = [math]::Round((($procs | Measure-Object WorkingSet64 -Sum).Sum) / 1MB)
            $priv = [math]::Round((($procs | Measure-Object PrivateMemorySize64 -Sum).Sum) / 1MB)
            "RAM {0}: {1} processes, {2} MB in use (working set), {3} MB private" -f $label, $procs.Count, $mb, $priv
            $procs | Stop-Process -Force -ErrorAction SilentlyContinue
            Start-Sleep -Seconds 3
          }
          Remove-Item Env:CRIX_SMOKE_TEST -ErrorAction SilentlyContinue
          Measure-App (Resolve-Path out/FlappyCrix.exe) @('flappy-crix', 'FlappyCrix', 'msedgewebview2') 'Rust app (this build)'
          $old = Join-Path $env:RUNNER_TEMP 'old.exe'
          try {
            Invoke-WebRequest 'https://github.com/CRIX447/FLAPPY-CRIX/releases/download/v2.1.3/FlappyCrix.exe' -OutFile $old
            Measure-App $old @('FlappyCrix', 'Flappy Crix', 'old') 'Old Electron app 2.1.3'
          } catch { "Could not measure the old app: $($_.Exception.Message)" }

      - name: Old-app updater file (moves Electron 2.x players to this app)
        shell: pwsh
        run: |
          $v = '${{ steps.files.outputs.version }}'
          $f = "FlappyCrixSetup-$v.exe"
          $bytes = [IO.File]::ReadAllBytes("out/$f")
          $sha = [Convert]::ToBase64String([Security.Cryptography.SHA512]::Create().ComputeHash($bytes))
          $date = (Get-Date).ToUniversalTime().ToString('yyyy-MM-ddTHH:mm:ss.fffZ')
          $yml = "version: $v`nfiles:`n  - url: $f`n    sha512: $sha`n    size: $($bytes.Length)`npath: $f`nsha512: $sha`nreleaseDate: '$date'`n"
          [IO.File]::WriteAllText((Join-Path $PWD 'out/latest.yml'), $yml)
          Get-Content out/latest.yml

      - name: Publish the release (only reached when every check passed)
        if: github.event_name == 'workflow_dispatch'
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $v = '${{ steps.files.outputs.version }}'
          $tag = "v$v"
          gh release view $tag --repo $env:GITHUB_REPOSITORY 2>$null
          if ($LASTEXITCODE -eq 0) { throw "Release $tag is already published. Raise the version to release again." }
          $files = @("out/FlappyCrixSetup-$v.exe", 'out/FlappyCrix.exe', 'out/latest.yml')
          $notes = "Flappy Crix $v for Windows: now a lightweight Rust app.`n`n- **FlappyCrixSetup-$v.exe**: installer (recommended)`n- **FlappyCrix.exe**: portable, no install (needs Microsoft Edge WebView2, which Windows 10 and 11 already have)`n`nPlayers on the old app are updated to this one automatically."
          gh release create $tag @files --repo $env:GITHUB_REPOSITORY --target $env:GITHUB_SHA --title $v --notes $notes --latest
          if ($LASTEXITCODE -ne 0) { throw 'Publishing failed' }

      # a copy on the run itself too, in case the release step is ever refused
      - uses: actions/upload-artifact@v4
        with:
          name: FlappyCrix-windows
          path: out/
