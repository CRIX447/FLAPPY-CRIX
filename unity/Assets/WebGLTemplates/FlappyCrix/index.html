<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, height=device-height, initial-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#0A0A0F">
<title>{{{ PRODUCT_NAME }}} HD</title>
<style>
  html, body { margin: 0; height: 100%; background: #0A0A0F; overflow: hidden; touch-action: none; }
  body { background-image: linear-gradient(rgba(255,70,85,.05) 1px, transparent 1px), linear-gradient(90deg, rgba(255,70,85,.05) 1px, transparent 1px);
         background-size: 48px 48px; font: 14px/1.4 system-ui, 'Segoe UI', sans-serif; color: #EDEDED; }
  #unity-canvas { position: fixed; inset: 0; width: 100%; height: 100%; display: block; background: #0A0A0F; outline: none; }
  #loading { position: fixed; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 16px; }
  #loading b { font-size: 34px; letter-spacing: 2px; background: linear-gradient(90deg, #FF4655, #FF6B35); -webkit-background-clip: text; background-clip: text; color: transparent; }
  #loading small { color: #00CC7A; letter-spacing: 4px; font-size: 11px; }
  #bar { width: min(420px, 80vw); height: 10px; border-radius: 6px; background: rgba(255,255,255,.08); overflow: hidden; }
  #fill { height: 100%; width: 0; border-radius: 6px; background: linear-gradient(90deg, #FF4655, #FF6B35); transition: width .2s; }
  #msg { color: #A6A6B2; font-size: 12px; min-height: 18px; text-align: center; padding: 0 20px; }
  #msg.bad { color: #FF4655; }
</style>
</head>
<body>
<canvas id="unity-canvas" tabindex="-1"></canvas>
<div id="loading">
  <b>FLAPPY CRIX HD</b>
  <small>TAP · COLLECT · DRIP</small>
  <div id="bar"><div id="fill"></div></div>
  <div id="msg">Loading the game…</div>
</div>
<script>
  var canvas = document.getElementById('unity-canvas');
  var msg = document.getElementById('msg');
  function fail(text) { msg.textContent = text; msg.className = 'bad'; }
  if (!window.WebAssembly) fail('This browser is too old for Flappy Crix HD. Try the main web game instead.');

  var buildUrl = 'Build';
  var config = {
    dataUrl: buildUrl + '/{{{ DATA_FILENAME }}}',
    frameworkUrl: buildUrl + '/{{{ FRAMEWORK_FILENAME }}}',
#if USE_THREADS
    workerUrl: buildUrl + '/{{{ WORKER_FILENAME }}}',
#endif
#if USE_WASM
    codeUrl: buildUrl + '/{{{ CODE_FILENAME }}}',
#endif
#if MEMORY_FILENAME
    memoryUrl: buildUrl + '/{{{ MEMORY_FILENAME }}}',
#endif
#if SYMBOLS_FILENAME
    symbolsUrl: buildUrl + '/{{{ SYMBOLS_FILENAME }}}',
#endif
    streamingAssetsUrl: 'StreamingAssets',
    companyName: {{{ JSON.stringify(COMPANY_NAME) }}},
    productName: {{{ JSON.stringify(PRODUCT_NAME) }}},
    productVersion: {{{ JSON.stringify(PRODUCT_VERSION) }}},
    // your progress is saved in the browser and kept between visits
    autoSyncPersistentDataPath: true,
    // sharp on phones and high-DPI screens, but not so sharp it slows down
    devicePixelRatio: Math.min(window.devicePixelRatio || 1, 2),
    showBanner: function (text, type) { if (type === 'error') fail(text); else console.warn(text); }
  };

  var script = document.createElement('script');
  script.src = buildUrl + '/{{{ LOADER_FILENAME }}}';
  script.onload = function () {
    createUnityInstance(canvas, config, function (p) {
      document.getElementById('fill').style.width = Math.round(p * 100) + '%';
    }).then(function () {
      document.getElementById('loading').remove();
      canvas.focus();
    }).catch(function (e) { fail('The game could not start: ' + e); });
  };
  script.onerror = function () { fail('Could not download the game. Check your connection and refresh.'); };
  document.body.appendChild(script);
</script>
</body>
</html>
